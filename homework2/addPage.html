<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostIt - Add Post</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Semantic Header with Profile Dropdown -->
  <header>
    <nav>
      <a href="index.html">Home</a>
      <span>|</span>
      <a href="addPost.html">addPost</a>
    </nav>

    <div class="profile-menu-container">
      <img
        src="res/avatar.svg"
        alt="User avatar"
        class="avatar"
        id="avatar-btn"
      >
      <div class="dropdown-menu" id="profile-dropdown">
        <p>John Doe</p>
        <p>john.doe@ut.ee</p>
        <p><a href="login.html">logout</a></p>
      </div>
    </div>
  </header>

  <!-- Semantic Main with Add Post Form -->
  <main>
    <form action="index.html" method="get">
      <label for="body">Post body</label>
      <textarea id="body" name="body" placeholder="textarea" required></textarea>

      <label for="file">Select file</label>
      <input type="file" id="file" name="file">

      <button type="submit" class="btn-primary">Create post</button>
    </form>
  </main>

  <!-- Semantic Footer -->
  <footer>
    <p>Footer</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
