<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostIt - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Semantic Header -->
  <header>
    <nav>
      <a href="index.html">Home</a>
    </nav>

    <div class="profile-menu-container">
      <img
        src="res/avatar.svg"
        alt="User avatar"
        class="avatar"
        id="avatar-btn"
      >
      <div class="dropdown-menu" id="profile-dropdown">
        <p>John Doe</p>
        <p>john.doe@ut.ee</p>
        <p><a href="login.html">logout</a></p>
      </div>
    </div>
  </header>

  <!-- Semantic Main with Login Form -->
  <main>
    <form action="index.html" method="get" class="login-form">
      <h2>Welcome to PostIt</h2>
      <p><a href="#">Create an account</a></p>
      <p>or</p>
      <p>Please log in</p>

      <!-- Required inputs: prevents submission if either is empty -->
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>

      <!-- Submit button redirects to index.html -->
      <button type="submit" class="btn-primary">Log in</button>

      <p><a href="#">Forget password</a></p>
    </form>
  </main>

  <!-- Semantic Footer -->
  <footer>
    <p>Footer</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
